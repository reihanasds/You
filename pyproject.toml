[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kim-holiday-content-draft"
version = "0.1.0"
description = "Deterministic, approval-gated marketing draft pipeline for Kim Holiday."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
