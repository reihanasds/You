name: Kim Holiday 3-day draft trial

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Tanggal mulai uji coba dalam UTC (YYYY-MM-DD)"
        required: false
        default: "2026-09-23"
  schedule:
    - cron: "15 0 * * *"

permissions:
  contents: read

env:
  TRIAL_START_DATE: "2026-09-23"

jobs:
  generate-draft:
    name: Generate one draft
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine trial day
        id: trial
        shell: bash
        env:
          REQUESTED_START_DATE: ${{ inputs.start_date }}
        run: |
          set -Eeuo pipefail
          start_date="${REQUESTED_START_DATE:-$TRIAL_START_DATE}"
          if ! [[ "$start_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::start_date harus menggunakan format YYYY-MM-DD."
            exit 1
          fi
          current_date="$(date -u +%F)"
          trial_day="$(( ($(date -u -d "$current_date" +%s) - $(date -u -d "$start_date" +%s)) / 86400 + 1 ))"
          if (( trial_day < 1 || trial_day > 3 )); then
            echo "::notice::Uji coba tiga hari tidak aktif pada $current_date (mulai: $start_date)."
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "active=true" >> "$GITHUB_OUTPUT"
          echo "day=$trial_day" >> "$GITHUB_OUTPUT"
          echo "start_date=$start_date" >> "$GITHUB_OUTPUT"

      - name: Generate deterministic draft
        if: steps.trial.outputs.active == 'true'
        id: draft
        shell: bash
        env:
          TRIAL_DAY: ${{ steps.trial.outputs.day }}
        run: |
          set -Eeuo pipefail
          topics=(
            "pertanyaan yang perlu diajukan sebelum merencanakan"
            "cara memulai percakapan yang bermakna dengan Kim Holiday"
            "langkah sederhana untuk mengeksplorasi penawaran saat ini"
          )
          topic="${topics[$((TRIAL_DAY - 1))]}"
          mkdir -p artifacts
          PYTHONPATH=src python -m kim_holiday "$topic" --output artifacts/draft.json
          python - "$TRIAL_DAY" "$topic" "${{ steps.trial.outputs.start_date }}" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("artifacts/draft.json")
          draft = json.loads(path.read_text())
          draft["run_metadata"] = {
              "trial_day": int(sys.argv[1]),
              "trial_start_date": sys.argv[3],
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "github_run_id": "${{ github.run_id }}",
              "github_run_attempt": "${{ github.run_attempt }}",
              "topic_angle": sys.argv[2],
              "provider": "penyedia-berbasis-aturan-deterministik",
              "publication": "dinonaktifkan",
          }
          path.write_text(json.dumps(draft, indent=2) + "\n")
          PY
          artifact="kim-holiday-draft-day-${TRIAL_DAY}-${{ github.run_id }}"
          mv artifacts/draft.json "artifacts/${artifact}.json"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Upload draft artifact
        if: steps.trial.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.draft.outputs.artifact }}
          path: artifacts/${{ steps.draft.outputs.artifact }}.json
          if-no-files-found: error
          retention-days: 7
